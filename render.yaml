services:
  - type: web
    name: shopease-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: shopease
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
